name: Paper Trading

on:
  schedule:
    # Toutes les 15 minutes (UTC). Suffisant pour des chandeliers 1h.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Paper trading step (6 actifs)
        run: |
          for sym in BTCUSDT ETHUSDT SOLUSDT BNBUSDT XRPUSDT ADAUSDT; do
            echo "=== $sym ==="
            python agents/paper_agent.py --symbol "$sym" --interval 1h
          done

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper/
          if git diff --cached --quiet; then
            echo "Aucun changement d'état"
          else
            git commit -m "paper: état mis à jour $(date -u +%FT%TZ)"
            git push
          fi
